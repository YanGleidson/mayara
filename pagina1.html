<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Presente Mayara! ❤️</title>
    <style>
        body {
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fce4ec; /* Rosa claro */
            margin: 0;
            color: #4a148c; /* Roxo escuro */
            text-align: center;
        }
        .present-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #880e4f; /* Vinho escuro */
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        p {
            font-size: 1.5em;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .gift-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .back-button {
            margin-top: 30px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #880e4f; /* Vinho escuro */
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .back-button:hover {
            background-color: #b71c1c; /* Vermelho um pouco mais claro */
            transform: translateY(-2px);
        }
        #brinco{
            text-decoration: #b71c1c;
            border-radius:20px;
            margin-top:40px;
            width: 300px;
            height: 60px;
        }
        #img{
            width: 300px;
            margin-top: 40px;
            border-radius: 20px;
        }

        
    </style>
</head>
<body>
    <div class="present-container">
        <h1>Este é o seu presente, Mayara! 🎁</h1>
        <p>Um lindo par de brincos, escolhido com muito carinho para você!</p>
        <p>Espero que goste muito, assim como eu amo cada momento ao seu lado.</p>
        <p>Feliz Dia dos Namorados, meu amor! ❤️</p>
        <a href="index.html"> <button  class="back-button" onclick="window.history.back()">Voltar ao Quiz</button></a>


      

    </div>

    <div>
    
     <a href="../love/img/brinco1.jpg" target="_blank">
            <button id="brinco">Veja a imagem</button>
            
        </a>
        
       
        

    </div>
        
    
        
    
</body>
</html>
